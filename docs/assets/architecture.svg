<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="t d">
<title id="t">CHOKEPOINT architecture</title><desc id="d">A React frontend calls a FastAPI backend. The backend parses scenarios, builds the attack graph, runs the optimizer, passes the raw scenario to a separate standard-library verifier that issues SHA-256 receipts, and generates explanations and PDF reports. There is no database and no external service.</desc>
<rect width="1280" height="700" rx="14" fill="#0b0d12"/><rect x=".5" y=".5" width="1279" height="699" rx="14" fill="none" stroke="#232938"/>
<rect x="24" y="24" width="300" height="640" rx="12" fill="none" stroke="#6aa6ff" stroke-opacity=".5" stroke-dasharray="5 4"/><text x="38" y="46" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="2" fill="#6aa6ff">BROWSER (REACT + TYPESCRIPT)</text>
<rect x="44" y="64" width="260" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="56" y="86" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">pages/Landing.tsx</text><text x="56" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Story built from live API data</text><text x="56" y="119" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">state/useStory.ts</text>
<rect x="44" y="142" width="260" height="76" rx="8" fill="#151b27" stroke="#333c50"/><text x="56" y="164" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">pages/Workspace.tsx + Panels.tsx</text><text x="56" y="182" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Inspect, Plan, Verify, Compare,</text><text x="56" y="197" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Receipt (state/useWorkspace.ts)</text>
<rect x="44" y="232" width="260" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="56" y="254" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">pages/Import.tsx</text><text x="56" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Paste/upload JSON, errors by path,</text><text x="56" y="287" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">graph preview</text>
<rect x="44" y="310" width="260" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="56" y="332" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">components/GraphCanvas.tsx</text><text x="56" y="350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Cytoscape.js rendering only;</text><text x="56" y="365" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">no graph rules in the frontend</text>
<rect x="44" y="388" width="260" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="56" y="410" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">api/client.ts</text><text x="56" y="428" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Typed fetch to /api/v1/*;</text><text x="56" y="443" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">PDF saved as a downloaded blob</text>
<rect x="44" y="466" width="260" height="78" rx="8" fill="#151b27" stroke="#f5b14c"/><text x="56" y="488" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">sessionStorage</text><text x="56" y="506" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Imported scenario lives only in</text><text x="56" y="521" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">the tab and is re-sent per request</text><text x="56" y="536" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">(lib/imported.ts)</text>
<rect x="364" y="24" width="330" height="640" rx="12" fill="none" stroke="#a9b1c2" stroke-opacity=".5" stroke-dasharray="5 4"/><text x="378" y="46" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="2" fill="#a9b1c2">API (FASTAPI)</text>
<rect x="384" y="64" width="290" height="150" rx="8" fill="#151b27" stroke="#333c50"/><text x="396" y="86" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">api/app.py</text><text x="396" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">GET  /health, /scenarios, /scenarios/&#123;id&#125;</text><text x="396" y="119" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">POST /graph, /plan, /verify</text><text x="396" y="134" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">POST /scenarios/validate, /report</text><text x="396" y="149" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">strict models, 256 KiB body cap</text><text x="396" y="164" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">one error envelope</text>
<rect x="384" y="232" width="290" height="76" rx="8" fill="#151b27" stroke="#333c50"/><text x="396" y="254" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">scenario/loader.py + validate.py</text><text x="396" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Built-in JSON from backend/scenarios/</text><text x="396" y="287" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">parse_scenario: strict schema, references</text>
<rect x="384" y="322" width="290" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="396" y="344" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">scenario/importer.py</text><text x="396" y="362" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Import limits (assets, rules, actions,</text><text x="396" y="377" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">search budget), then parse_scenario</text>
<rect x="384" y="400" width="290" height="76" rx="8" fill="#151b27" stroke="#333c50"/><text x="396" y="422" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">explain.py</text><text x="396" y="440" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Facts / inference / human review</text><text x="396" y="455" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">per action; solver-status notes</text>
<rect x="384" y="490" width="290" height="76" rx="8" fill="#151b27" stroke="#333c50"/><text x="396" y="512" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">report/pdf.py (ReportLab)</text><text x="396" y="530" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Summary, before/after graphs, actions,</text><text x="396" y="545" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">verification evidence; recomputed server-side</text>
<rect x="734" y="24" width="520" height="640" rx="12" fill="none" stroke="#47d391" stroke-opacity=".5" stroke-dasharray="5 4"/><text x="748" y="46" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="2" fill="#47d391">MODEL ENGINE</text>
<rect x="754" y="64" width="230" height="92" rx="8" fill="#151b27" stroke="#333c50"/><text x="766" y="86" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">graph/semantics.py</text><text x="766" y="104" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Attack graph: exploit and credential</text><text x="766" y="119" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">edges gated by firewall rules;</text><text x="766" y="134" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">reachability and witness path</text>
<rect x="754" y="172" width="230" height="92" rx="8" fill="#151b27" stroke="#333c50"/><text x="766" y="194" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">solver/exact.py</text><text x="766" y="212" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Branch and bound over catalogue</text><text x="766" y="227" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">actions; OPTIMAL only if the search</text><text x="766" y="242" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">finishes, else FEASIBLE_NOT_PROVEN</text>
<rect x="754" y="280" width="230" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="766" y="302" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">actions/ + domain/models.py</text><text x="766" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Action effects; cost =</text><text x="766" y="335" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">effort + 2 x downtime (dh)</text>
<rect x="1004" y="64" width="230" height="330" rx="12" fill="none" stroke="#6aa6ff" stroke-opacity=".5" stroke-dasharray="5 4"/><text x="1018" y="86" font-family="ui-monospace,Menlo,monospace" font-size="11" letter-spacing="2" fill="#6aa6ff">INDEPENDENT VERIFIER</text>
<rect x="1018" y="100" width="202" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="1030" y="122" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">chokepoint_verifier/</text><text x="1030" y="140" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Standard library only;</text><text x="1030" y="155" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">imports nothing from the planner</text>
<rect x="1018" y="178" width="202" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="1030" y="200" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">parse.py + semantics.py</text><text x="1030" y="218" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Own validation and fixpoint</text><text x="1030" y="233" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">reachability from raw JSON</text>
<rect x="1018" y="256" width="202" height="64" rx="8" fill="#151b27" stroke="#333c50"/><text x="1030" y="278" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">checks.py</text><text x="1030" y="296" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Ten checks: cost, flows, targets,</text><text x="1030" y="311" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">IDs, exclusions, mandatory</text>
<rect x="1018" y="334" width="202" height="50" rx="8" fill="#151b27" stroke="#333c50"/><text x="1030" y="356" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">receipt.py</text><text x="1030" y="374" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Canonical JSON + SHA-256</text>
<rect x="754" y="424" width="480" height="112" rx="8" fill="#151b27" stroke="#47d391"/><text x="766" y="446" font-family="ui-monospace,Menlo,monospace" font-size="12.5" font-weight="600" fill="#eceae5">Outputs</text><text x="766" y="464" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Plan: actions, cost in dh, solver status, proof metadata</text><text x="766" y="479" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">Verification verdict and checks</text><text x="766" y="494" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">JSON receipt (SHA-256 fingerprint, not a signature)</text><text x="766" y="509" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#a9b1c2">PDF report and per-action explanations</text>
<text x="754" y="566" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8590a6">Not present: database, authentication, AI or LLM service, live network</text>
<text x="754" y="584" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8590a6">scanning, automatic changes to real systems.</text>
<text x="754" y="608" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8590a6">Imported scenarios are parsed per request and never stored on the server.</text>
