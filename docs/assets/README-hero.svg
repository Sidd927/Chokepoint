<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
<title id="t">CHOKEPOINT: Cut the path. Keep the service.</title><desc id="d">Illustration: a modelled network before and after remediation. Red modelled attack paths reach critical targets before the plan and are cut afterwards, while the green dotted required service flows remain.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d12"/><stop offset="1" stop-color="#11161f"/></linearGradient>
<radialGradient id="glow" cx="0.8" cy="0.4" r="0.6"><stop offset="0" stop-color="#6aa6ff" stop-opacity=".10"/><stop offset="1" stop-color="#6aa6ff" stop-opacity="0"/></radialGradient></defs>
<rect width="1280" height="360" rx="14" fill="url(#bg)"/><rect width="1280" height="360" rx="14" fill="url(#glow)"/><rect x=".5" y=".5" width="1279" height="359" rx="14" fill="none" stroke="#232938"/>
<text x="64" y="86" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" font-weight="700" letter-spacing="6" fill="#6aa6ff">CHOKEPOINT</text>
<text x="62" y="160" font-family="'New York',Georgia,'Times New Roman',serif" font-size="58" letter-spacing="-1.5" fill="#eceae5">Cut the path.</text>
<text x="62" y="224" font-family="'New York',Georgia,'Times New Roman',serif" font-size="58" letter-spacing="-1.5" fill="#47d391">Keep the service.</text>
<text x="64" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#a9b1c2">Graph-based remediation planning for modelled networks,</text>
<text x="64" y="297" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#a9b1c2">with an independent verifier and reviewable evidence.</text>
