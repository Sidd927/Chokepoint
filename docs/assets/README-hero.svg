<text x="660" y="272" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8590a6">Schematic illustration of the idea. Measured results are in the README.</text>
<g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#8590a6"><circle cx="664" cy="308" r="5" fill="#1b3556" stroke="#6aa6ff" stroke-width="2"/><text x="676" y="312">attacker origin</text>
